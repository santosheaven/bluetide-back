# BlueTide - Development Profile
# Activate with: SPRING_PROFILES_ACTIVE=dev
# MongoDB local
spring.data.mongodb.uri=mongodb://localhost:27017/bluetide
# Logging verbose
logging.level.com.bluetide=DEBUG
logging.level.org.springframework.web=DEBUG
logging.level.org.springframework.security=DEBUG
# Swagger enabled
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true
# CORS permissive for local development
cors.allowed-origins=http://localhost:3000,http://localhost:4200,http://localhost:5173
# Mail - in dev emails are logged if no SMTP configured
spring.mail.host=${MAIL_HOST:localhost}
spring.mail.port=${MAIL_PORT:1025}
