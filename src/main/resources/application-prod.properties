# BlueTide - Production Profile
# Activate with: SPRING_PROFILES_ACTIVE=prod
# MongoDB - required via environment variable
spring.data.mongodb.uri=${MONGODB_URI}
# JWT - required via environment variable
jwt.secret=${JWT_SECRET}
# Logging
logging.level.root=WARN
logging.level.com.bluetide=INFO
logging.level.org.springframework.web=WARN
logging.level.org.springframework.security=WARN
# Swagger disabled in production
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false
# CORS - adjust to real domain
cors.allowed-origins=${CORS_ORIGINS:https://app.bluetide.com}
# Mail
spring.mail.host=${MAIL_HOST}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
# Actuator - only health in production
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when-authorized
