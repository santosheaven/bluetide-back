spring.application.name=bluetide
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}
#spring.mongodb.uri=mongodb+srv://cluster99717.rcq6tno.mongodb.net
#spring.mongodb.uri=mongodb+srv://cluster99717:a35Fa3JiUk5o@cluster99717.rcq6tno.mongodb.net/bluetide?retryWrites=true&w=majority

spring.data.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/bluetide}
server.port=8080

# JWT Configuration
jwt.secret=${JWT_SECRET:default-dev-secret-change-in-production-min-32-chars!!}
jwt.expiration=86400000
jwt.refresh-expiration=604800000
jwt.algorithm=${JWT_ALGORITHM:HS256}

# Optional: if using AWS DocumentDB with a custom CA bundle, set the path here
# documentdb.pem.path=/path/to/rds-combined-ca-bundle.pem

# OAuth2 Configuration (Google)
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID:your-google-client-id}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET:your-google-client-secret}
spring.security.oauth2.client.registration.google.scope=email,profile

# CORS Configuration
cors.allowed-origins=http://localhost:3000,http://localhost:4200
cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS
cors.allowed-headers=*
cors.allow-credentials=false

# Mail Configuration
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# Swagger / OpenAPI
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# Internationalization (i18n)
spring.messages.basename=messages
spring.messages.encoding=UTF-8
spring.messages.fallback-to-system-locale=false
spring.messages.use-code-as-default-message=true

# Actuator / Health Check
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=when-authorized
management.info.env.enabled=true
info.app.name=BlueTide Backend
info.app.version=0.0.1-SNAPSHOT
info.app.description=Property management platform API

